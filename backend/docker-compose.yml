version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=globallens-ai-hackathon-secret-key-2025
      - DATABASE_URL=sqlite:///./globallens.db
      - WEB_RISK_MONITOR_URL=https://cmfwyngz91sn8o3wt46vmu9sp.agent.a.smyth.ai/api/analyze_route_risks
      - ACTION_PLAN_AGENT_URL=https://cmfxk1sby3663o3wtnuunk659.agent.a.smyth.ai/api/generate_action_plan
    volumes:
      - ./globallens.db:/app/globallens.db
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - production
